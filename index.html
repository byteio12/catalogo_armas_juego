<script>
    const categorias = {
      sniper: ['Barret X4 Cal.50', 'M110'],
      
      // Armas Principales: Fusiles, SMGs y Escopetas
      fusiles_smg_shotgun: [
        'Honey Badger', 'FX-05 TRIPE CARGADOR', 'M16A2 GL Montana', 'AK - 47 GOLD', 
        'Vector CRB', 'SBR556', 'Galil Ace Mod', 'P90', 'MP5A4', 'FAL MOD', 
        'M16', 'AUG 43', 'Remigton R5S MOD', 'M76', 'MP5K', 'Thompson', 
        'RPK GOLD', 'TEC-9', 'Draco Gold', 'Saiga 12' // La Saiga ahora es arma principal
      ],
      
      pesadas: [
        'MINIMI MOD', 'Ameli', 'M60', 'M249', 'Fightliter MCR', 'Minigun'
      ],
      
      explosivos: ['RPG-7', 'Lanzagranadas'],
      
      // Solo Pistolas puras y Melee
      defensa_pistolas: [
        'Glock 17', 'M1911 Millonaria', 'Super 38', 
        'Berreta GOLD', 'Makarov', 'Eagle Desert 50c',
        'Macahuitl', 'Pantera Machete', 'Carambit'
      ]
    };

    function obtenerAleatorio(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    function elegirArmas() {
      const seleccion = [
        obtenerAleatorio(categorias.sniper),
        obtenerAleatorio(categorias.fusiles_smg_shotgun),
        obtenerAleatorio(categorias.pesadas),
        obtenerAleatorio(categorias.explosivos),
        obtenerAleatorio(categorias.defensa_pistolas)
      ];

      for (let i = 0; i < 5; i++) {
        let nombreDisplay = seleccion[i];
        
        if (nombreDisplay.includes("GOLD") || nombreDisplay.includes("Millonaria")) {
          nombreDisplay = "⭐ " + nombreDisplay;
        }

        document.getElementById(`arma${i + 1}`).textContent = `Slot ${i + 1}: ${nombreDisplay}`;
      }
    }
</script>
